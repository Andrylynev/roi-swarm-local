[project]
name = "roi-swarm"
version = "0.1.0"
description = "Local Bonsai AI swarm with isolated Hermes workers and native inference"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anyio>=4.0.0",
  "fastapi>=0.115.0",
  "tiktoken>=0.9.0",
  "uvicorn[standard]>=0.34.0",
  "langgraph>=1.0.0",
  "openai>=2.0.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "psutil>=7.0.0,<8",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0.2",
  "rich>=13.0.0",
  "typer>=0.15.0",
]

[project.optional-dependencies]
# Optional local ONNX embedder for vector RAG; the default install omits embeddings.
embeddings = [
  "huggingface-hub>=1.0.0",
  "numpy>=2.0.0",
  "onnxruntime>=1.20.0",
  "tokenizers>=0.22.0",
]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.9.0",
]

[project.scripts]
roi-local = "local.cli:main"
roi-swarm = "roi_swarm.cli:app"
roi-swarm-rag = "roi_swarm.rag_cli:app"
roi-swarm-server = "roi_swarm.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roi_swarm", "local"]
artifacts = ["src/roi_swarm/static/*.html", "local/*.json", "local/*.example.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
